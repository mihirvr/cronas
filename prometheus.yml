global:
  scrape_interval: 5s # Scrape every 5 seconds for real-time data

scrape_configs:
  - job_name: 'cronas-cluster'
    metrics_path: '/actuator/prometheus'
    # Use Docker's internal DNS to find all scaled instances of 'cronas-app'
    dns_sd_configs:
      - names:
          - 'cronas-app'
        type: 'A'
        port: 8080