version: '3.8'

services:
  # Shared Persistent Database
  cronas-db:
    image: postgres:16-alpine
    container_name: cronas-db
    environment:
      POSTGRES_DB: cronas
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cronas"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cronas-network

  # Shared Coordination and Distributed Locking Layer
  cronas-redis:
    image: redis:7.2-alpine
    container_name: cronas-redis
    ports:
      - "6380:6379" # Changed to 6380 for the host to avoid conflicts
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cronas-network

  # Scalable Application Instances
  cronas-app:
    build: .
    environment:
      - DB_HOST=cronas-db
      - DB_PORT=5432
      - DB_NAME=cronas
      - DB_USER=postgres
      - DB_PASS=postgres
      - REDIS_HOST=cronas-redis
      - REDIS_PORT=6379 # Kept at 6379 for internal Docker network routing
    ports:
      - "9090-9092:8080" # Maps containers to hosts 8080, 8081, 8082 automatically when scaled
    depends_on:
      cronas-db:
        condition: service_healthy
      cronas-redis:
        condition: service_healthy
    networks:
      - cronas-network
  prometheus:
    image: prom/prometheus:latest
    container_name: cronas-prometheus
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
    ports:
      - "9095:9090" # Changed from 9091 to avoid colliding with the Java nodes
    networks:
      - cronas-network

  grafana:
    image: grafana/grafana:latest
    container_name: cronas-grafana
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin
    networks:
      - cronas-network

networks:
  cronas-network:
    driver: bridge